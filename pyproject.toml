[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "professional-youtube-downloader"
version = "0.1.0"
description = "Professional YouTube Downloader desktop application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8.0",
  "yt-dlp>=2025.1.0",
  "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
